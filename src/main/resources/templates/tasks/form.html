<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${taskId == null ? 'New Task' : 'Edit Task'})}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0 fw-bold" th:text="${taskId == null ? 'Create New Task' : 'Edit Task'}">Task Form</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="${taskId == null ? '/tasks/new' : '/tasks/edit/' + taskId}" 
                          th:object="${taskRequest}" method="post" class="needs-validation">
                        
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">Title</label>
                            <input type="text" th:field="*{title}" class="form-control" id="title" 
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   placeholder="What needs to be done?">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description (Optional)</label>
                            <textarea th:field="*{description}" class="form-control" id="description" rows="3" 
                                      placeholder="Add some details..."></textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="dueDate" class="form-label fw-semibold">Due Date</label>
                                <input type="date" th:field="*{dueDate}" class="form-control" id="dueDate"
                                       th:classappend="${#fields.hasErrors('dueDate')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="status" class="form-label fw-semibold">Status</label>
                                <select th:field="*{status}" class="form-select" id="status"
                                        th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/tasks}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4" 
                                    th:text="${taskId == null ? 'Create Task' : 'Update Task'}">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
